name: CI
on:
  push:
    branches:
      - "main"
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned release binary, checksum verified against the value measured at pin time.
      - name: Install stylua
        env:
          STYLUA_VERSION: "2.5.2"
          STYLUA_SHA256: "bcb0d855e91f102f28a370e850f8566b3b44b79e6274d806ea5246837c0fd5ab"
        run: |
          curl -fsSL -o stylua.zip "https://github.com/JohnnyMorganz/StyLua/releases/download/v${STYLUA_VERSION}/stylua-linux-x86_64.zip"
          printf '%s  stylua.zip\n' "$STYLUA_SHA256" | shasum -a 256 -c -
          unzip -q stylua.zip
          chmod 0755 stylua
          sudo mv stylua /usr/local/bin/stylua
      - name: Install luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y luarocks
          sudo luarocks install luacheck
      - name: stylua --check
        run: stylua --check .
      - name: luacheck
        run: luacheck .
      - name: Only the dam boundary spawns a process
        run: |
          if grep -rn 'vim\.system' lua --include='*.lua' | grep -v '^lua/damnit/dam\.lua:'; then
            echo "vim.system belongs in lua/damnit/dam.lua and nowhere else" >&2
            exit 1
          fi
      - name: Nothing waits on a dam call
        run: |
          if grep -rn ':wait(' lua --include='*.lua' | grep -v '^lua/damnit/health\.lua:'; then
            echo ":wait( belongs in lua/damnit/health.lua and in tests, and nowhere else" >&2
            exit 1
          fi
      - name: The pure modules call no Neovim API
        run: |
          pure=(
            lua/damnit/status_model.lua
            lua/damnit/task_format.lua
            lua/damnit/list_format.lua
            lua/damnit/tree.lua
            lua/damnit/location.lua
            lua/damnit/answer.lua
          )
          if grep -nHE 'vim\.(api|fn|system|notify|schedule)' "${pure[@]}"; then
            echo "these six are pure: they may use vim.tbl_*, vim.islist, vim.json, vim.split, vim.deep_equal" >&2
            exit 1
          fi
      - name: No em-dash
        run: |
          if grep -rn $'\xe2\x80\x94' lua tests docs README.md; then
            echo "an em-dash belongs nowhere here: use a comma, a period or parentheses" >&2
            exit 1
          fi
      - name: No host data
        run: |
          if grep -rnE '/Users/|/home/[a-z]|dresden|stephen|webdavis\.io' lua tests docs README.md; then
            echo "a public repository carries no home path, machine name or personal address" >&2
            exit 1
          fi
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned release tarball, checksum verified against the value measured at pin time.
      # v0.12.5 matches the version the README says this plugin is developed and tested on.
      - name: Install Neovim
        env:
          NVIM_VERSION: "v0.12.5"
          NVIM_SHA256: "bce0f56eda1f1b1db6eee8f4133d7a38813ea07933837dd1777411ca384c6875"
        run: |
          curl -fsSL -o nvim.tar.gz "https://github.com/neovim/neovim/releases/download/${NVIM_VERSION}/nvim-linux-x86_64.tar.gz"
          printf '%s  nvim.tar.gz\n' "$NVIM_SHA256" | shasum -a 256 -c -
          tar xzf nvim.tar.gz
          echo "$PWD/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Run the test suite
        run: nvim --headless --clean -l tests/run.lua
